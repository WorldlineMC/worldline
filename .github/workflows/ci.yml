name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness-tests:
    name: Harness trace and launch fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Check harness scripts and fixtures
        run: |
          bash -n harness/*.sh
          harness/assert-m5-trace.sh --self-test
          python3 -B harness/test_harness_launch.py

  proxy-tests:
    name: Proxy tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Test Worldline proxy code
        working-directory: proxy
        run: ./gradlew :velocity-proxy:test --tests "com.velocitypowered.proxy.worldline.*"

      - name: Test full proxy suite
        working-directory: proxy
        run: ./gradlew :velocity-proxy:test

      - name: Build proxy jar
        working-directory: proxy
        run: ./gradlew :velocity-proxy:shadowJar

  server-build:
    name: Server compile
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Apply server patches
        working-directory: server
        run: |
          git config --global user.email "no-reply@github.com"
          git config --global user.name "GitHub Actions"
          ./gradlew applyPatches

      - name: Test Worldline server code
        working-directory: server
        run: ./gradlew :paper-server:test --tests "org.bukkit.support.suite.WorldlineTestSuite"

      - name: Compile server
        working-directory: server
        run: ./gradlew :paper-server:compileJava

      - name: Build server jar
        working-directory: server
        run: ./gradlew :paper-server:createBundlerJar
